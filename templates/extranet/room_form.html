<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room to {{ hotel.name }} | Extranet</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <style>
    form p { margin-bottom: 1rem; }
    form label { display: block; font-weight: 500; margin-bottom: 0.25rem; }
    form input[type="text"], form input[type="number"], form select, form textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body class="bg-light">
  <main class="container section section--sm">
    <div class="card p-8">
      <h1 class="heading-3 mb-6">Add Room to {{ hotel.name }}</h1>
      
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h2 class="heading-4 mb-4 mt-6">Basic Info</h2>
        {{ form.as_p }}
        
        <h2 class="heading-4 mb-4 mt-8">Photo Gallery</h2>
        {{ formset.management_form }}
        <div id="formset-container">
          {% for f in formset %}
            <div class="formset-row card p-4 mb-4" style="background: #fff;">
              {{ f.as_p }}
            </div>
          {% endfor %}
        </div>
        <button type="button" class="btn btn--outline btn--sm mb-6" id="add-photo-btn">+ Add another photo</button>
        
        <div class="mt-6">
          <button type="submit" class="btn btn--primary">Save Room</button>
          <a href="{% url 'extranet-dashboard' %}" class="btn btn--ghost ml-4">Cancel</a>
        </div>
      </form>
    </div>
  </main>
  
  <script>
    document.getElementById('add-photo-btn').addEventListener('click', function() {
      const container = document.getElementById('formset-container');
      const totalForms = document.getElementById('id_gallery_images-TOTAL_FORMS');
      let formCount = parseInt(totalForms.value);
      
      const rows = container.getElementsByClassName('formset-row');
      const newRow = rows[rows.length - 1].cloneNode(true);
      
      newRow.innerHTML = newRow.innerHTML.replace(new RegExp(`-${formCount - 1}-`, 'g'), `-${formCount}-`);
      newRow.innerHTML = newRow.innerHTML.replace(new RegExp(`_${formCount - 1}_`, 'g'), `_${formCount}_`);
      
      newRow.querySelectorAll('input:not([type=hidden]), select, textarea').forEach(input => {
        if (input.type === 'checkbox') input.checked = false;
        else input.value = '';
      });
      
      container.appendChild(newRow);
      totalForms.value = formCount + 1;
    });
  </script>
</body>
</html>
