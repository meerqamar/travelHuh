<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Travel Huh?</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body class="bg-light">
  <main class="container section section--sm container--narrow">
    <div class="card p-6">
      <h1 class="heading-3 mb-6">Create your Travel Huh? account</h1>
      {% if error %}<p class="text-pink mb-4">{{ error }}</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group mb-4"><label class="form-label" for="username">Username</label><input class="form-input" id="username" name="username" required></div>
        <div class="form-group mb-4"><label class="form-label" for="email">Email</label><input class="form-input" id="email" name="email" type="email" required></div>
        <div class="form-group mb-6"><label class="form-label" for="password">Password</label><input class="form-input" id="password" name="password" type="password" minlength="8" required></div>
        <button class="btn btn--primary w-100" type="submit">Create Account</button>
      </form>
      <p class="text-muted mt-4">Already registered? <a class="text-pink" href="{% url 'login' %}">Sign in</a></p>
    </div>
  </main>
</body>
</html>
